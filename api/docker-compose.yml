# Local development database only. The API itself runs with `npm run start:dev`.
# Values come from api/.env (same DB_* variables the API reads).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required in api/.env}
      POSTGRES_USER: ${DB_USER:?DB_USER is required in api/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in api/.env}
    ports:
      - '${DB_PORT:?DB_PORT is required in api/.env}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway database for integration tests (api/test/). Credentials are fixed and
  # must match api/.env.test.example. Data lives in tmpfs, so it is wiped on restart.
  # Start it with: docker compose up -d postgres-test
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pet_adoption_test
      POSTGRES_USER: pet_test_user
      POSTGRES_PASSWORD: pet_test_password
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
